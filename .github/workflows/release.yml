name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Tag Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Host "Releasing version: $version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Restore Dependencies
        run: |
          dotnet restore Fileo.csproj
          dotnet restore Tests/Fileo.Tests.csproj

      - name: Run Tests
        run: dotnet test Tests/Fileo.Tests.csproj -c Release --verbosity normal

      - name: Publish Application
        run: |
          dotnet publish Fileo.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.get_version.outputs.VERSION }} -o publish

      - name: Setup Inno Setup
        uses: automattic/action-inno-setup@v1

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          ISCC.exe /DMyAppVersion=${{ steps.get_version.outputs.VERSION }} installer\fileo_setup.iss

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $installerPath = "installer\output\Fileo_Setup_v${{ steps.get_version.outputs.VERSION }}.exe"
          $installer = Get-Item $installerPath
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          $hashLine = "$hash *$($installer.Name)"
          $shaFile = "$($installer.FullName).sha256"
          [System.IO.File]::WriteAllText($shaFile, $hashLine)
          Write-Host "Generated SHA-256: $hashLine"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fileo v${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            installer/output/Fileo_Setup_v${{ steps.get_version.outputs.VERSION }}.exe
            installer/output/Fileo_Setup_v${{ steps.get_version.outputs.VERSION }}.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
